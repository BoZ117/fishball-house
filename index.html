<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>鱼丸的小屋</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-cream: #FFF8F0;
            --bg-warm: #FFF3E6;
            --accent: #E8945A;
            --accent-deep: #D47840;
            --accent-light: #F5C4A1;
            --text-primary: #3D2B1F;
            --text-secondary: #6B5544;
            --text-muted: #9B8575;
            --white: #FFFFFF;
            --shadow-sm: 0 1px 3px rgba(61,43,31,0.06);
            --shadow-md: 0 4px 16px rgba(61,43,31,0.08);
            --shadow-lg: 0 12px 32px rgba(61,43,31,0.12);
            --shadow-xl: 0 20px 48px rgba(61,43,31,0.16);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg-cream);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.25; pointer-events: none; z-index: 0;
        }
        .bg-orb-1 { width: 280px; height: 280px; background: radial-gradient(circle, rgba(240,184,160,0.5) 0%, transparent 70%); top: -80px; right: -60px; }
        .bg-orb-2 { width: 240px; height: 240px; background: radial-gradient(circle, rgba(245,196,161,0.45) 0%, transparent 70%); bottom: -60px; left: -50px; }
        .bg-orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(232,148,90,0.3) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); }

        .app-container { position: relative; z-index: 1; min-height: 100vh; }

        /* 逐字动画 */
        .char { display: inline-block; opacity: 0; transform: translateY(25px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .char.show { opacity: 1; transform: translateY(0); }

        .hero-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px; text-align: center;
            transition: opacity 0.5s, transform 0.5s;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.6), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(240,240,240,0.9), transparent 50%);
        }
        .hero-section.fade-out { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        .hero-title {
            font-family: 'Georgia', 'Noto Serif SC', serif;
            font-size: clamp(2.4rem, 8vw, 3.8rem); font-weight: 700; letter-spacing: 0.06em; position: relative;
            color: #111; margin-bottom: 8px;
        }
        .hero-title::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 3px; background: var(--accent); border-radius: 2px; opacity: 0.8;
        }
        .hero-subtitle {
            font-size: clamp(1rem, 3vw, 1.15rem); color: #222;
            margin-top: 16px; letter-spacing: 0.08em; font-weight: 400;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .hero-subtitle.show { opacity: 1; transform: translateY(0); }

        .hero-image-wrapper { position: relative; margin: 32px 0 28px; transition: transform 0.5s var(--transition-spring); }
        .hero-image-wrapper:active { transform: scale(0.97); }
        .hero-image-glow {
            position: absolute; inset: -30px; border-radius: var(--radius-xl);
            background: radial-gradient(ellipse at center, rgba(44,44,44,0.1) 0%, transparent 70%);
            z-index: 0; animation: glowPulse 3s ease-in-out infinite; pointer-events: none;
        }
        @keyframes glowPulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.04); } }
        .hero-image-frame {
            position: relative; z-index: 1; width: min(70vw, 240px); height: min(70vw, 240px);
            border-radius: 50%; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), 0 0 0 4px rgba(44,44,44,0.15);
            background: #e0e0e0; display: flex; align-items: center; justify-content: center;
        }
        .hero-image-frame img { width: 100%; height: 100%; object-fit: cover; }

        .hero-stats {
            display: flex; gap: 28px; margin-top: 24px; font-size: 1rem;
            color: #fff; font-weight: 500;
            background: rgba(20,20,20,0.8); backdrop-filter: blur(16px);
            padding: 14px 32px; border-radius: 40px; box-shadow: var(--shadow-lg);
        }
        .hero-stats span { display: flex; align-items: center; gap: 6px; }
        .hero-stats strong { color: var(--accent); font-size: 1.3rem; font-weight: 700; }

        .btn-enter {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 15px 38px; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em;
            color: #fff; background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            transition: all 0.4s var(--transition-spring);
            margin-top: 16px; -webkit-tap-highlight-color: transparent;
        }
        .btn-enter:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
        .btn-enter:active { transform: scale(0.96); }

        /* 相册页面 */
        .gallery-section {
            display: none; min-height: 100vh; padding: 0 0 40px;
            animation: fadeInUp 0.5s forwards;
            background: var(--bg-cream);
            padding-top: 80px;
        }
        .gallery-section.active { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 固定导航栏 */
        .gallery-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
            padding: 12px 18px;
            background: rgba(255,248,240,0.95); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            box-shadow: var(--shadow-md);
            border-radius: 0;
        }
        .gallery-nav-title { font-family: 'Georgia', serif; font-size: 1.2rem; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px; color: var(--text-primary); }
        .gallery-nav-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .stats-bar {
            display: flex; justify-content: flex-start; align-items: center;
            gap: 32px; padding: 18px 24px; margin: 12px 12px 20px;
            background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(20px);
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            color: #e0e0e0; font-size: 1.05rem; font-weight: 500; letter-spacing: 0.02em;
        }
        .stats-bar strong { color: #c8a27a; font-size: 1.5rem; font-weight: 700; margin: 0 4px; }

        .btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 8px 18px;
            font-size: 0.85rem; font-weight: 500; border: none; border-radius: 50px;
            cursor: pointer; transition: all 0.3s var(--transition-spring);
            white-space: nowrap; background: transparent; -webkit-tap-highlight-color: transparent;
        }
        .btn-outline { border: 1.5px solid var(--accent-light); color: var(--accent-deep); }
        .btn-outline:hover { background: rgba(232,148,90,0.08); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; box-shadow: 0 4px 12px rgba(212,120,64,0.2); }
        .btn-primary:active { transform: scale(0.96); opacity: 0.9; }
        .btn-back { color: var(--text-secondary); padding: 8px 14px; }
        .btn-admin { background: var(--accent-deep); color: #fff; }
        .btn-profile { background: #6B5544; color: #fff; }

        .gallery-grid { column-count: 5; column-gap: 10px; padding: 0 8px; width: 100%; }
        .image-card { break-inside: avoid; margin-bottom: 10px; position: relative; border-radius: var(--radius-md); overflow: hidden; background: var(--white); box-shadow: var(--shadow-sm); cursor: pointer; transition: all 0.3s var(--transition-smooth); }
        .image-card:active { transform: scale(0.97); }
        .image-card-inner { position: relative; background: var(--bg-warm); border-radius: var(--radius-md) var(--radius-md) 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .image-card-inner img { width: 100%; height: auto; object-fit: contain; transition: transform 0.5s; display: block; }
        .image-card:hover .image-card-inner img { transform: scale(1.03); }

        .image-time-overlay {
            position: absolute; bottom: 0; right: 0;
            padding: 4px 10px; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
            color: #fff; font-size: 0.7rem; border-top-left-radius: 8px;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap;
        }
        .image-card:hover .image-time-overlay { opacity: 1; }

        .image-card-info {
            padding: 8px 12px 10px; display: flex; flex-direction: column;
            background: var(--white); border-radius: 0 0 var(--radius-md) var(--radius-md);
        }
        .image-card-title { font-size: 0.8rem; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; min-height: 1.2em; }
        .image-card-author { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .badge-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .badge { font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
        .badge-preset { background: #FFF3E6; color: #C07840; }
        .badge-submission { background: #FFF0ED; color: #D47860; }

        .image-card-actions {
            display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f0e8e0;
        }
        .card-action-btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 36px; min-height: 36px; border: none; border-radius: 50%;
            cursor: pointer; font-size: 1rem; transition: all 0.2s;
            background: rgba(232,148,90,0.1); color: var(--accent-deep);
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .card-action-btn:active { transform: scale(0.9); background: rgba(232,148,90,0.25); }
        .card-action-btn.delete-btn { color: #c0392b; background: rgba(192,57,43,0.08); }
        .card-action-btn.delete-btn:active { background: rgba(192,57,43,0.2); }

        .more-box { margin: 30px 12px 10px; padding: 32px 28px; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(20px); border-radius: 20px; color: #eee; text-align: left; }
        .more-title { font-family: 'Georgia', serif; font-size: 1.8rem; font-weight: 700; color: #c8a27a; margin-bottom: 20px; }
        .more-links { display: flex; justify-content: flex-start; gap: 32px; flex-wrap: wrap; }
        .more-links .more-link { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 28px; border-radius: 50px; font-size: 1rem; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .more-links .more-link:hover { background: rgba(255,255,255,0.2); border-color: #c8a27a; color: #c8a27a; }

        .message-section { display: none; min-height: 100vh; padding: 0 16px 40px; background: var(--bg-cream); animation: fadeInUp 0.5s forwards; padding-top: 80px; }
        .message-section.active { display: block; }
        .message-container { max-width: 700px; margin: 80px auto 40px; background: var(--white); border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow-md); }
        .message-list { max-height: 50vh; overflow-y: auto; margin-bottom: 24px; }
        .message-item { padding: 14px 16px; border-bottom: 1px solid #f0e8e0; position: relative; }
        .message-item .msg-author { font-weight: 600; color: var(--accent-deep); margin-bottom: 4px; }
        .message-item .msg-text { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }
        .message-item .msg-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }
        .message-item .msg-delete { position: absolute; top: 8px; right: 12px; font-size: 0.8rem; color: #c0392b; cursor: pointer; background: none; border: none; opacity: 0.6; transition: 0.2s; }
        .message-item .msg-delete:hover { opacity: 1; }
        .message-item .msg-admin-delete { color: #fff; background: #c0392b; border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; font-weight: bold; }
        .message-form { display: flex; flex-direction: column; gap: 12px; }
        .message-form textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #E8DDD4; border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--bg-cream); outline: none; resize: vertical; min-height: 80px; }
        .message-form .form-row { display: flex; align-items: center; gap: 12px; }
        .message-form .anonymous-check { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-secondary); }
        .message-form button { align-self: flex-end; padding: 10px 28px; }

        .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(61,43,31,0.5); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-dialog { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 20px 24px; width: 100%; max-width: 500px; box-shadow: var(--shadow-xl); transform: translateY(30px); transition: transform 0.35s var(--transition-spring); max-height: 85vh; overflow-y: auto; }
        .modal-overlay.active .modal-dialog { transform: translateY(0); }
        .modal-close { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.04); border: none; border-radius: 50%; width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); transition: 0.3s; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #E8DDD4; border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--bg-cream); transition: 0.3s; outline: none; }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,148,90,0.1); background: #fff; }
        .file-upload-area { border: 2px dashed #E8DDD4; border-radius: var(--radius-md); padding: 24px 16px; text-align: center; cursor: pointer; transition: 0.3s; background: var(--bg-cream); }
        .file-upload-area:active, .file-upload-area.dragover { border-color: var(--accent-light); background: #FFF9F4; }
        .file-upload-area input[type="file"] { display: none; }
        .file-upload-icon { font-size: 2rem; display: block; margin-bottom: 6px; }
        .file-upload-text { font-size: 0.85rem; color: var(--text-muted); }
        .file-list { margin-top: 12px; max-height: 150px; overflow-y: auto; background: #FFFBF7; border-radius: 8px; padding: 8px 12px; display: none; text-align: left; }
        .file-list.has-files { display: block; }
        .file-list-item { font-size: 0.78rem; color: var(--text-secondary); padding: 4px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
        .file-list-item:last-child { border-bottom: none; }
        .file-preview { width: 100%; max-height: 140px; object-fit: contain; border-radius: var(--radius-sm); margin-top: 10px; display: none; }
        .form-submit { width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.04em; border: none; border-radius: 50px; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); box-shadow: 0 4px 12px rgba(212,120,64,0.2); transition: 0.3s; margin-top: 6px; }
        .form-submit:active { transform: scale(0.97); }

        .lightbox-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(30,20,14,0.95); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s; cursor: pointer; }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-content { position: relative; max-width: 95vw; max-height: 85vh; transform: scale(0.9); transition: 0.3s; }
        .lightbox-overlay.active .lightbox-content { transform: scale(1); }
        .lightbox-content img { max-width: 95vw; max-height: 75vh; object-fit: contain; border-radius: 12px; }
        .lightbox-close { position: absolute; top: -40px; right: 0; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; color: #fff; cursor: pointer; transition: 0.3s; }
        .lightbox-download { padding: 10px 24px; font-size: 0.9rem; font-weight: 600; border-radius: 50px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; transition: 0.3s; backdrop-filter: blur(8px); }

        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3000; }
        .toast { padding: 10px 22px; border-radius: 50px; font-size: 0.85rem; font-weight: 500; color: #fff; background: rgba(61,43,31,0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-lg); margin-top: 6px; animation: toastIn 0.3s forwards, toastOut 0.3s 2s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

        .profile-avatar { width: 60px; height: 60px; background: var(--accent-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px; color: #fff; }
        .profile-stats { text-align: center; margin-bottom: 18px; color: var(--text-secondary); font-size: 0.9rem; }
        .profile-stats strong { color: var(--accent-deep); }

        @media (min-width: 1200px) { .gallery-grid { column-count: 5; } }
        @media (max-width: 1199px) and (min-width: 768px) { .gallery-grid { column-count: 3; column-gap: 10px; } }
        @media (max-width: 767px) {
            .gallery-grid { column-count: 2; column-gap: 8px; padding: 0 4px; }
            .image-card { margin-bottom: 8px; }
            .gallery-nav { flex-direction: column; align-items: flex-start; padding: 10px 14px; }
            /* 修复移动端按钮一行显示 */
            .gallery-nav-actions {
                width: 100%;
                flex-wrap: nowrap;
                justify-content: space-between;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .btn {
                padding: 5px 8px;
                font-size: 0.7rem;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .stats-bar { margin: 8px 8px 14px; gap: 16px; font-size: 0.9rem; padding: 14px 18px; }
            .hero-stats { flex-direction: column; gap: 8px; padding: 10px 20px; }
            .hero-title { font-size: 2rem; }
            .hero-image-frame { width: 55vw; height: 55vw; }
            .more-links { flex-direction: column; gap: 14px; }
            .gallery-section { padding-top: 150px !important; }
            .message-section { padding-top: 150px !important; }
        }
    </style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="app-container">
    <section class="hero-section" id="heroSection">
        <h1 class="hero-title" id="heroTitle">鱼丸的小屋</h1>
        <p class="hero-subtitle" id="heroSubtitle">✨ 温馨 · 分享 · 珍藏 ✨</p>
        <div class="hero-image-wrapper">
            <div class="hero-image-glow"></div>
            <div class="hero-image-frame" id="heroImageFrame">
                <img src="https://picsum.photos/300/300" alt="杀生鱼丸" style="width:100%;height:100%;object-fit:cover;">
            </div>
        </div>
        <div class="hero-stats" id="heroStats">
            <span>📸 <strong id="heroTotalImages">0</strong> 张图片</span>
            <span>👥 <strong id="heroTotalAuthors">0</strong> 位投稿人</span>
        </div>
        <button class="btn-enter" id="btnEnter">进入小屋 <span>→</span></button>
    </section>

    <section class="gallery-section" id="gallerySection">
        <nav class="gallery-nav">
            <button class="btn btn-back" id="btnBack">← 返回</button>
            <span class="gallery-nav-title">🏠 鱼丸的小屋</span>
            <div class="gallery-nav-actions">
                <button class="btn btn-profile" id="btnOpenProfile">👤 我的</button>
                <button class="btn btn-outline" id="btnOpenSubmit">💌 投稿</button>
                <button class="btn btn-primary" id="btnBatchDownload">📦 下载全部</button>
                <button class="btn btn-admin" id="btnAdminMode">🔑 管理</button>
            </div>
        </nav>
        <div class="stats-bar" id="galleryStats">
            <span>📸 <strong id="galleryTotalImages">0</strong> 张图片</span>
            <span>👥 <strong id="galleryTotalAuthors">0</strong> 位投稿人</span>
            <span>💬 <strong id="galleryTotalMessages">0</strong> 条留言</span>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="more-box">
            <div class="more-title">更 多</div>
            <div class="more-links">
                <button class="more-link" id="btnOpenMessages">💬 留言板（写与鱼丸的故事）</button>

<script>
    // ==================== 标题逐字动画 ====================
    const heroTitleEl = document.getElementById('heroTitle');
    const heroSubtitleEl = document.getElementById('heroSubtitle');
    const titleText = heroTitleEl.textContent.trim();
    heroTitleEl.innerHTML = '';
    [...titleText].forEach(char => {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char;
        heroTitleEl.appendChild(span);
    });
    const chars = document.querySelectorAll('.char');
    chars.forEach((char, i) => {
        setTimeout(() => { char.classList.add('show'); }, i * 120);
    });
    setTimeout(() => { heroSubtitleEl.classList.add('show'); }, titleText.length * 120 + 200);

    // ==================== Supabase 配置 ====================
    const SUPABASE_URL = 'https://jiqwlxyspqylgpnsjvnq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppcXdseHlzcHF5bGdwbnNqdm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMDg0MDQsImV4cCI6MjEwMDg4NDQwNH0.J7kfxF4NvCPzGy-q5x1Ff6kX4ixc2McaxQE29gFQTVw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const fileTitleMap = new Map();
    const PRESET_IMAGES = [];
    let submissionImages = [];
    let adminMode = false;

    const PROFILE_KEY = 'fishball_profile';
    function getProfile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || { author: '', password: '' }; } catch { return { author: '', password: '' }; } }
    function saveProfile(author, password) { localStorage.setItem(PROFILE_KEY, JSON.stringify({ author, password })); }

    const heroTotalImagesEl = document.getElementById('heroTotalImages');
    const heroTotalAuthorsEl = document.getElementById('heroTotalAuthors');
    const galleryTotalImagesEl = document.getElementById('galleryTotalImages');
    const galleryTotalAuthorsEl = document.getElementById('galleryTotalAuthors');
    const galleryTotalMessagesEl = document.getElementById('galleryTotalMessages');

    async function updateStats() {
        const totalImages = submissionImages.length + PRESET_IMAGES.length;
        const uniqueAuthors = new Set(submissionImages.map(img => img.author));
        heroTotalImagesEl.textContent = totalImages;
        heroTotalAuthorsEl.textContent = uniqueAuthors.size;
        galleryTotalImagesEl.textContent = totalImages;
        galleryTotalAuthorsEl.textContent = uniqueAuthors.size;
        const { count } = await sb.from('messages').select('*', { count: 'exact', head: true });
        galleryTotalMessagesEl.textContent = count || 0;
    }

    async function loadSubmissions() {
        const { data, error } = await sb.from('submissions').select('*').order('created_at', { ascending: false });
        if (error) { console.error('加载投稿失败:', error); showToast('加载投稿失败'); return; }
        submissionImages = data.map(row => ({
            id: 'sub-' + row.id,
            src: row.image_data,
            title: row.title,
            author: row.author,
            submittedAt: row.created_at,
            delete_password: row.delete_password
        }));
        await updateStats();
        renderGallery();
    }

    function getAllImages() { return [...PRESET_IMAGES, ...submissionImages]; }

    const heroSection = document.getElementById('heroSection');
    const gallerySection = document.getElementById('gallerySection');
    const galleryGrid = document.getElementById('galleryGrid');
    const messageSection = document.getElementById('messageSection');
    const messageList = document.getElementById('messageList');
    const messageForm = document.getElementById('messageForm');
    const msgContent = document.getElementById('msgContent');
    const msgAnonymous = document.getElementById('msgAnonymous');
    const submitModalOverlay = document.getElementById('submitModalOverlay');
    const profileModalOverlay = document.getElementById('profileModalOverlay');
    const aboutModalOverlay = document.getElementById('aboutModalOverlay');
    const submitForm = document.getElementById('submitForm');
    const profileForm = document.getElementById('profileForm');
    const inputTitle = document.getElementById('inputTitle');
    const profileAuthor = document.getElementById('profileAuthor');
    const profilePassword = document.getElementById('profilePassword');
    const inputFile = document.getElementById('inputFile');
    const fileUploadArea = document.getElementById('fileUploadArea');
    const filePreview = document.getElementById('filePreview');
    const fileList = document.getElementById('fileList');
    const btnSubmitForm = document.getElementById('btnSubmitForm');
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImage = document.getElementById('lightboxImage');
    const toastContainer = document.getElementById('toastContainer');
    let currentLightboxImage = null;

    function showToast(msg) {
        const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
        toastContainer.appendChild(t);
        setTimeout(() => { if (t.parentNode) t.remove(); }, 2400);
    }

    function compressImage(dataUrl, maxWidth = 800) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(c.toDataURL('image/jpeg', 0.8));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    }

    function handleFileSelect(files) {
        if (!files || files.length === 0) {
            filePreview.style.display = 'none'; fileList.classList.remove('has-files'); fileList.innerHTML = ''; return;
        }
        const firstValid = Array.from(files).find(f => f.type.match(/^image\/(jpeg|png|webp)$/) && f.size <= 10*1024*1024);
        if (firstValid) {
            const reader = new FileReader();
            reader.onload = e => { filePreview.src = e.target.result; filePreview.style.display = 'block'; };
            reader.readAsDataURL(firstValid);
        } else { filePreview.style.display = 'none'; }
        const baseTitle = inputTitle.value.trim();
        let listHtml = `<div style="font-weight:600; margin-bottom:6px;">已选 ${files.length} 张图片：</div>`;
        for (let i = 0; i < files.length; i++) {
            const f = files[i];
            const sizeMB = (f.size / 1024 / 1024).toFixed(2);
            const valid = (f.type.match(/^image\/(jpeg|png|webp)$/) && f.size <= 10*1024*1024) ? '✅' : '⚠️';
            const key = f.name + '_' + f.size;
            let defaultTitle = baseTitle ? baseTitle : '';
            defaultTitle = fileTitleMap.get(key) || defaultTitle;
            listHtml += `<div class="file-list-item"><div style="flex:1;"><span>${valid} ${f.name} <span class="file-size">${sizeMB} MB</span></span><input type="text" class="custom-title-input" value="${defaultTitle}" data-file-key="${key}" placeholder="留空则无标题" style="width:100%; margin-top:4px; padding:4px 8px; border:1px solid #ddd; border-radius:6px; font-size:0.8rem;"></div></div>`;
        }
        fileList.innerHTML = listHtml;
        fileList.classList.add('has-files');
        document.querySelectorAll('.custom-title-input').forEach(input => {
            input.addEventListener('input', () => { fileTitleMap.set(input.dataset.fileKey, input.value.trim()); });
        });
    }

    fileUploadArea.addEventListener('click', () => inputFile.click());
    inputFile.addEventListener('change', () => handleFileSelect(inputFile.files));
    fileUploadArea.addEventListener('dragover', e => { e.preventDefault(); fileUploadArea.classList.add('dragover'); });
    fileUploadArea.addEventListener('dragleave', () => fileUploadArea.classList.remove('dragover'));
    fileUploadArea.addEventListener('drop', e => {
        e.preventDefault();
        fileUploadArea.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            const currentFiles = inputFile.files;
            const dt = new DataTransfer();
            for (let i = 0; i < currentFiles.length; i++) dt.items.add(currentFiles[i]);
            for (let i = 0; i < e.dataTransfer.files.length; i++) dt.items.add(e.dataTransfer.files[i]);
            inputFile.files = dt.files;
            inputFile.dispatchEvent(new Event('change'));
        }
    });

    function renderGallery() {
        const all = getAllImages();
        if (!all.length) {
            galleryGrid.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-muted);width:100%;">🖼️<br>图库空空，快去投稿吧</div>`;
            return;
        }
        galleryGrid.innerHTML = all.map((img, i) => {
            const isSub = img.id && img.id.startsWith('sub-');
            const timeStr = isSub ? new Date(img.submittedAt).toLocaleDateString() : '精选';
            let actionButtons = '';
            if (isSub) {
                if (adminMode) {
                    actionButtons += `<button class="card-action-btn delete-btn" data-action="admin-delete" data-id="${img.id}" data-title="${img.title.replace(/"/g, '&quot;')}">🔧</button>`;
                } else {
                    actionButtons += `<button class="card-action-btn delete-btn" data-action="delete" data-id="${img.id}" data-title="${img.title.replace(/"/g, '&quot;')}">✕</button>`;
                }
            }
            actionButtons += `<button class="card-action-btn" data-action="download" data-index="${i}">⬇</button>`;
            return `<div class="image-card" data-index="${i}" data-id="${img.id}">
                <div class="image-card-inner">
                    <img src="${img.src}" alt="${img.title}" loading="lazy" onerror="this.parentElement.parentElement.style.display='none';">
                    <div class="image-time-overlay">${timeStr}</div>
                </div>
                <div class="image-card-info">
                    <span class="image-card-title">${img.title ? img.title.replace(/</g,'&lt;') : ''}</span>
                    <span class="image-card-author">by ${img.author.replace(/</g,'&lt;')}</span>
                    <div class="badge-row">
                        <span class="badge ${isSub?'badge-submission':'badge-preset'}">${isSub?'投稿':'精选'}</span>
                    </div>
                    <div class="image-card-actions">${actionButtons}</div>
                </div>
            </div>`;
        }).join('');

        document.querySelectorAll('[data-action="download"]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                downloadSingle(getAllImages()[parseInt(btn.dataset.index)]);
            });
        });

        const deleteHandler = async (e) => {
            e.stopPropagation();
            e.preventDefault();
            const btn = e.currentTarget;
            const id = btn.dataset.id;
            const numericId = parseInt(id.replace('sub-', ''));
            const title = btn.dataset.title;
            const isAdmin = btn.dataset.action === 'admin-delete';
            if (isAdmin) {
                if (!confirm(`管理员删除《${title || '无标题'}》？`)) return;
                const ADMIN_PWD = 'FishBallAdmin2025';
                const { error } = await sb.rpc('admin_delete_submission', { submission_id: numericId, admin_pwd: ADMIN_PWD });
                if (error) { showToast('❌ 管理员密码错误或删除失败'); return; }
                showToast('🗑️ 管理员已删除');
            } else {
                const password = prompt(`请输入《${title || '无标题'}》的删除密码：`);
                if (!password) return;
                const { error } = await sb.rpc('delete_submission', { submission_id: numericId, pwd: password });
                if (error) { showToast('❌ 密码错误或投稿不存在'); return; }
                showToast('🗑️ 已删除');
            }
            await loadSubmissions();
            if (currentLightboxImage && currentLightboxImage.id === id) closeLightbox();
        };

        document.querySelectorAll('[data-action="delete"], [data-action="admin-delete"]').forEach(btn => {
            btn.addEventListener('click', deleteHandler);
            btn.addEventListener('touchend', deleteHandler, { passive: false });
        });

        document.querySelectorAll('.image-card').forEach(card => {
            card.addEventListener('click', e => {
                if (e.target.closest('button')) return;
                openLightbox(parseInt(card.dataset.index));
            });
        });
    }

    async function downloadSingle(img) {
        try {
            const blob = await fetch(img.src).then(r => r.blob());
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (img.title || 'image') + '.jpg'; a.click();
            showToast('✅ 已下载');
        } catch { window.open(img.src, '_blank'); }
    }

    async function batchDownload() {
        const all = getAllImages(); if (!all.length) return showToast('图库为空');
        showToast('📦 打包中...'); const zip = new JSZip(); const folder = zip.folder('鱼丸的小屋');
        for (let i = 0; i < all.length; i++) {
            try { const blob = await fetch(all[i].src).then(r => r.blob()); folder.file(`${i+1}_${all[i].title || '无标题'}.jpg`, blob); } catch {}
        }
        const content = await zip.generateAsync({ type: 'blob' }); const a = document.createElement('a');
        a.href = URL.createObjectURL(content); a.download = '鱼丸的小屋_合集.zip'; a.click();
        showToast('✅ 打包完成');
    }

    function openLightbox(idx) {
        const img = getAllImages()[idx]; if (!img) return;
        currentLightboxImage = img; lightboxImage.src = img.src;
        lightboxOverlay.classList.add('active'); document.body.style.overflow = 'hidden';
    }
    function closeLightbox() { lightboxOverlay.classList.remove('active'); document.body.style.overflow = ''; currentLightboxImage = null; }

    // 留言板
    async function loadMessages() {
        const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: false });
        if (error) { messageList.innerHTML = '<p style="text-align:center;color:#999;">加载留言失败</p>'; return; }
        if (!data.length) { messageList.innerHTML = '<p style="text-align:center;color:#999;">暂无留言，快来写下你与鱼丸的故事吧～</p>'; return; }
        messageList.innerHTML = data.map(m => `
            <div class="message-item">
                <div class="msg-author">${m.show_author ? m.author : '匿名'}</div>
                <div class="msg-text">${m.content}</div>
                <div class="msg-time">${new Date(m.created_at).toLocaleString()}</div>
                ${adminMode 
                    ? `<button class="msg-delete msg-admin-delete" data-id="${m.id}">管理员删除</button>`
                    : `<button class="msg-delete" data-id="${m.id}">✕</button>`
                }
            </div>
        `).join('');

        document.querySelectorAll('.msg-delete').forEach(btn => {
            const handler = async (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                if (adminMode) {
                    if (!confirm('确定以管理员身份删除这条留言？')) return;
                    const ADMIN_PWD = 'FishBallAdmin2025';
                    const { error } = await sb.rpc('admin_delete_message', { message_id: parseInt(id), admin_pwd: ADMIN_PWD });
                    if (error) { showToast('❌ 管理员删除失败'); return; }
                    showToast('🗑️ 管理员已删除留言');
                } else {
                    const password = prompt('请输入删除密码（与个人主页密码相同）：');
                    if (!password) return;
                    const { error } = await sb.rpc('delete_message', { message_id: parseInt(id), pwd: password });
                    if (error) { showToast('❌ 密码错误或留言不存在'); return; }
                    showToast('🗑️ 留言已删除');
                }
                await loadMessages();
                await updateStats();
            };
            btn.addEventListener('click', handler);
            btn.addEventListener('touchend', handler, { passive: false });
        });
    }

    messageForm.addEventListener('submit', async e => {
        e.preventDefault();
        const profile = getProfile();
        if (!profile.author || !profile.password) {
            showToast('请先在个人主页设置昵称和密码');
            return;
        }
        const content = msgContent.value.trim();
        if (!content) return showToast('请输入留言内容');
        const anonymous = msgAnonymous.checked;
        const { error } = await sb.from('messages').insert({
            author: profile.author,
            content,
            delete_password: profile.password,
            show_author: !anonymous
        });
        if (error) { showToast('留言失败'); return; }
        msgContent.value = '';
        showToast('留言成功！');
        await loadMessages();
        await updateStats();
    });

    async function updateProfileStats() {
        const profile = getProfile();
        const author = profile.author;
        if (!author) { document.getElementById('profileSubmissions').textContent = 0; document.getElementById('profileMessages').textContent = 0; return; }
        const { count: subCount } = await sb.from('submissions').select('*', { count: 'exact', head: true }).eq('author', author);
        const { count: msgCount } = await sb.from('messages').select('*', { count: 'exact', head: true }).eq('author', author);
        document.getElementById('profileSubmissions').textContent = subCount || 0;
        document.getElementById('profileMessages').textContent = msgCount || 0;
    }

    function openProfileModal() {
        const p = getProfile(); profileAuthor.value = p.author; profilePassword.value = p.password;
        updateProfileStats();
        profileModalOverlay.classList.add('active'); document.body.style.overflow = 'hidden';
    }
    function closeProfileModal() { profileModalOverlay.classList.remove('active'); document.body.style.overflow = ''; }
    profileForm.addEventListener('submit', e => {
        e.preventDefault();
        const author = profileAuthor.value.trim(), password = profilePassword.value.trim();
        if (!author || !password) return showToast('昵称和密码不能为空');
        saveProfile(author, password); showToast('个人信息已保存'); closeProfileModal();
    });

    function openSubmitModal() {
        fileTitleMap.clear();
        submitForm.reset();
        filePreview.style.display = 'none'; filePreview.src = '';
        fileList.classList.remove('has-files'); fileList.innerHTML = '';
        submitModalOverlay.classList.add('active'); document.body.style.overflow = 'hidden';
    }
    function closeSubmitModal() { submitModalOverlay.classList.remove('active'); document.body.style.overflow = ''; }

    submitForm.addEventListener('submit', async e => {
        e.preventDefault();
        const profile = getProfile();
        if (!profile.author || !profile.password) {
            showToast('请先在个人主页设置昵称和密码');
            return;
        }
        let title = inputTitle.value.trim();
        const author = profile.author;
        const password = profile.password;
        const files = inputFile.files;
        if (!files.length) return showToast('请选择至少一张图片');
        title = title.substring(0,15);
        btnSubmitForm.disabled = true; btnSubmitForm.textContent = '⏳ 上传中...';
        let count = 0, skipped = 0;
        for (let i = 0; i < files.length; i++) {
            const f = files[i];
            if (!f.type.match(/^image\/(jpeg|png|webp)$/) || f.size > 10*1024*1024) {
                skipped++; showToast(`⚠️ 跳过 "${f.name}"`); continue;
            }
            try {
                btnSubmitForm.textContent = `⏳ 上传中 (${i+1}/${files.length})...`;
                const dataUrl = await new Promise((resolve, reject) => {
                    const r = new FileReader(); r.onload = ev => compressImage(ev.target.result).then(resolve).catch(reject); r.onerror = reject; r.readAsDataURL(f);
                });
                const key = f.name + '_' + f.size;
                const customInput = document.querySelector(`.custom-title-input[data-file-key="${key}"]`);
                let finalTitle = ''; if (customInput) finalTitle = customInput.value.trim();
                const { error } = await sb.from('submissions').insert({
                    title: finalTitle,
                    author,
                    image_data: dataUrl,
                    delete_password: password
                });
                if (error) { console.error('上传失败:', f.name, error); showToast(`⚠️ "${f.name}" 上传失败`); continue; }
                count++;
            } catch (err) { console.error(err); showToast(`⚠️ "${f.name}" 处理出错`); continue; }
        }
        if (count > 0) { closeSubmitModal(); showToast(`🎉 成功投稿 ${count} 张${skipped ? '，跳过 '+skipped+' 张' : ''}`); await loadSubmissions(); }
        else if (skipped > 0) showToast('⚠️ 所有图片均不符合要求'); else showToast('⚠️ 没有有效图片');
        btnSubmitForm.disabled = false; btnSubmitForm.textContent = '✨ 提交投稿';
    });

    function toggleAdminMode() {
        if (adminMode) {
            adminMode = false;
            document.getElementById('btnAdminMode').textContent = '🔑 管理';
            document.getElementById('btnAdminModeMsg').textContent = '🔑 管理';
            showToast('已退出管理员模式');
        } else {
            const pwd = prompt('请输入管理员密码：');
            if (pwd === 'FishBallAdmin2025') {
                adminMode = true;
                document.getElementById('btnAdminMode').textContent = '🔑 退出管理';
                document.getElementById('btnAdminModeMsg').textContent = '🔑 退出管理';
                showToast('已进入管理员模式');
            } else {
                showToast('❌ 管理员密码错误');
                return;
            }
        }
        if (gallerySection.classList.contains('active')) {
            renderGallery();
        } else if (messageSection.classList.contains('active')) {
            loadMessages();
        }
    }

    document.getElementById('btnAdminMode').addEventListener('click', toggleAdminMode);
    document.getElementById('btnAdminModeMsg').addEventListener('click', toggleAdminMode);

    document.getElementById('btnEnter').addEventListener('click', () => {
        heroSection.classList.add('fade-out');
        setTimeout(() => { heroSection.style.display = 'none'; gallerySection.classList.add('active'); gallerySection.style.display = 'block'; window.scrollTo(0,0); }, 350);
    });
    document.getElementById('btnBack').addEventListener('click', () => {
        gallerySection.classList.remove('active'); gallerySection.style.display = 'none';
        heroSection.style.display = 'flex'; heroSection.classList.remove('fade-out'); window.scrollTo(0,0);
        adminMode = false; document.getElementById('btnAdminMode').textContent = '🔑 管理'; document.getElementById('btnAdminModeMsg').textContent = '🔑 管理';
    });
    document.getElementById('btnOpenMessages').addEventListener('click', () => {
        gallerySection.classList.remove('active'); gallerySection.style.display = 'none';
        messageSection.classList.add('active'); messageSection.style.display = 'block';
        loadMessages(); window.scrollTo(0,0);
    });
    document.getElementById('btnBackFromMessages').addEventListener('click', () => {
        messageSection.classList.remove('active'); messageSection.style.display = 'none';
        gallerySection.classList.add('active'); gallerySection.style.display = 'block';
        window.scrollTo(0,0);
    });
    document.getElementById('btnOpenAbout').addEventListener('click', () => { aboutModalOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; });
    document.getElementById('btnAboutClose').addEventListener('click', () => { aboutModalOverlay.classList.remove('active'); document.body.style.overflow = ''; });
    aboutModalOverlay.addEventListener('click', e => { if (e.target === aboutModalOverlay) { aboutModalOverlay.classList.remove('active'); document.body.style.overflow = ''; } });

    document.getElementById('btnOpenProfile').addEventListener('click', openProfileModal);
    document.getElementById('btnProfileClose').addEventListener('click', closeProfileModal);
    profileModalOverlay.addEventListener('click', e => { if (e.target === profileModalOverlay) closeProfileModal(); });
    document.getElementById('btnOpenSubmit').addEventListener('click', openSubmitModal);
    document.getElementById('btnModalClose').addEventListener('click', closeSubmitModal);
    submitModalOverlay.addEventListener('click', e => { if (e.target === submitModalOverlay) closeSubmitModal(); });
    document.getElementById('btnBatchDownload').addEventListener('click', batchDownload);
    document.getElementById('btnLightboxClose').addEventListener('click', closeLightbox);
    lightboxOverlay.addEventListener('click', e => { if (e.target === lightboxOverlay) closeLightbox(); });
    document.getElementById('btnLightboxDownload').addEventListener('click', () => { if (currentLightboxImage) downloadSingle(currentLightboxImage); });
    document.addEventListener('keydown', e => { if (e.key==='Escape') { closeLightbox(); closeSubmitModal(); closeProfileModal(); aboutModalOverlay.classList.remove('active'); document.body.style.overflow = ''; } });

    gallerySection.style.display = 'none';
    messageSection.style.display = 'none';
    loadSubmissions();
</script>
</body>
</html>
